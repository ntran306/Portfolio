<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NT isometric mark, tried at actual tab size per instruction — a
         synthetic 16px render looked illegible, but that's not the same as
         how a real browser downscales it, and plenty of detailed tab icons
         read fine in practice. favicon.svg (the flat N monogram, confirmed
         legible at 16px) is still on disk if this doesn't hold up live. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS ignores this icon's alpha channel and applies its own mask, so it's
         pre-flattened onto --bg navy rather than left transparent. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Nathan Tran — Developer</title>
    <meta
      name="description"
      content="Nathan Tran — CS student at Georgia Tech building interactive experiences across games, web, and XR, with research in AI-driven robotics."
    />
    <meta name="author" content="Nathan Tran" />
    <meta name="theme-color" content="#060f1d" />

    <link rel="canonical" href="https://nathanantran.com/" />

    <!-- Link previews (Slack, iMessage, LinkedIn, X). The image URLs must stay
         absolute — preview scrapers reject relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nathan Tran" />
    <meta property="og:url" content="https://nathanantran.com/" />
    <meta property="og:title" content="Nathan Tran — Developer" />
    <meta
      property="og:description"
      content="CS student at Georgia Tech building interactive experiences across games, web, and XR, with research in AI-driven robotics."
    />
    <meta property="og:image" content="https://nathanantran.com/assets/photo1_sq.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nathan Tran — Developer" />
    <meta
      name="twitter:description"
      content="CS student at Georgia Tech building interactive experiences across games, web, and XR, with research in AI-driven robotics."
    />
    <meta name="twitter:image" content="https://nathanantran.com/assets/photo1_sq.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
